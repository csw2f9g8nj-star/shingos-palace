<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Shingo's Palace refined circular logo</title>
  <desc id="desc">Premium aqua circular logo with a smooth white paw and heart inspired by the original Shingo's Palace identity.</desc>
  <defs>
    <style>
      .brand{fill:#35a9a2}
      .white{fill:#fff}
      .stitch{fill:none;stroke:#fff;stroke-width:15;stroke-linecap:round;stroke-dasharray:28 34;opacity:.9}
      .fine{fill:none;stroke:#fff;stroke-width:4;opacity:.22}
      .word{font-family:Avenir Next, Helvetica Neue, Arial, sans-serif;font-weight:850;letter-spacing:8px}
      .sub{font-family:Avenir Next, Helvetica Neue, Arial, sans-serif;font-weight:850;letter-spacing:10px}
    </style>
    <path id="topArc" d="M190 506a322 322 0 0 1 644 0"/>
  </defs>
  <rect width="1024" height="1024" fill="#fff"/>
  <circle cx="512" cy="512" r="455" class="brand"/>
  <circle cx="512" cy="512" r="405" class="stitch"/>
  <circle cx="512" cy="512" r="356" class="fine"/>
  <g transform="translate(0 6)">
    <text class="word white" stroke="#fff" stroke-width="2.2" paint-order="stroke fill" font-size="72">
      <textPath href="#topArc" startOffset="50%" text-anchor="middle">SHINGO'S PALACE</textPath>
    </text>
  </g>
  <g transform="translate(0 0)">
    <ellipse cx="512" cy="388" rx="56" ry="74" class="white"/>
    <ellipse cx="386" cy="455" rx="61" ry="82" class="white" transform="rotate(-28 386 455)"/>
    <ellipse cx="638" cy="455" rx="61" ry="82" class="white" transform="rotate(28 638 455)"/>
    <ellipse cx="437" cy="335" rx="49" ry="68" class="white" transform="rotate(-9 437 335)"/>
    <ellipse cx="587" cy="335" rx="49" ry="68" class="white" transform="rotate(9 587 335)"/>
    <path class="white" d="M512 503c88 0 158 67 158 146 0 59-42 99-94 91-27-4-41-18-64-18s-37 14-64 18c-52 8-94-32-94-91 0-79 70-146 158-146z"/>
    <path class="brand" d="M512 653c-11-11-59-43-59-81 0-28 21-49 49-49 18 0 33 10 43 25 10-15 25-25 43-25 28 0 49 21 49 49 0 38-48 70-59 81l-33 31-33-31z" transform="translate(-33 8) scale(1.06)"/>
  </g>
  <text x="512" y="825" class="sub white" stroke="#fff" stroke-width="2" paint-order="stroke fill" font-size="84" text-anchor="middle">PET HOTEL</text>
  <text x="512" y="878" fill="#fff" opacity=".78" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="5" text-anchor="middle">BOUTIQUE HOME RETREAT</text>
</svg>
