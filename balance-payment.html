<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pay Remaining Balance | Shingo's Palace</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/jpeg" href="assets/logo-shingos-palace.jpeg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="payment-success-page">
      <section class="payment-success-card balance-payment-card">
        <a class="payment-success-brand" href="index.html" aria-label="Shingo's Palace home">
          <img src="assets/logo-shingos-palace.jpeg" alt="Shingo's Palace Pet Hotel logo" />
          <span>Shingo's Palace</span>
        </a>

        <div class="payment-success-state">
          <p class="summary-kicker">Secure Payment</p>
          <h1>Pay your remaining balance</h1>
          <p id="balancePaymentIntro">
            Loading your secure payment link...
          </p>
        </div>

        <section class="balance-method-panel" id="balanceMethodPanel" hidden>
          <div class="balance-amount-line">
            <span>Amount due</span>
            <strong id="balanceAmountDue">$0</strong>
          </div>
          <fieldset class="payment-method-options">
            <legend>Choose payment method</legend>
            <label class="payment-method-option">
              <input name="balancePaymentMethod" type="radio" value="stripe" checked />
              <span>
                <strong>Card / Apple Pay / Google Pay</strong>
                <small>Secure payment through Stripe. No card surcharge is added.</small>
              </span>
            </label>
            <label class="payment-method-option" id="balanceZelleOption">
              <input name="balancePaymentMethod" type="radio" value="zelle" />
              <span>
                <strong>Zelle</strong>
                <small>No processing fee. Payment remains pending until verified.</small>
              </span>
            </label>
          </fieldset>
          <div class="zelle-instructions" id="balanceZelleInstructions" hidden>
            <strong>Zelle instructions</strong>
            <p id="balanceZelleInstructionsText"></p>
          </div>
          <button class="submit-button" id="balanceContinueButton" type="button">Continue</button>
        </section>

        <div class="payment-confirmation manual-payment-confirmation" id="balanceManualConfirmation" hidden>
          <strong>Payment instructions saved.</strong>
          <p id="balanceManualConfirmationText"></p>
        </div>

        <div class="stripe-checkout-shell balance-checkout-shell" id="balanceStripeCheckout" hidden>
          <p>Loading secure payment form...</p>
        </div>
        <p class="status-line" id="balancePaymentStatus" aria-live="polite"></p>
      </section>
    </main>
    <script src="https://js.stripe.com/v3/"></script>
    <script src="balance-payment.js"></script>
  </body>
</html>
